<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 440" width="100%" height="100%" style="overflow: visible;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00b4d8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0f7a8a" stop-opacity="0.02" />
    </linearGradient>

    <linearGradient id="boardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16324f" />
      <stop offset="100%" stop-color="#0f2338" />
    </linearGradient>

    <linearGradient id="paperGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f4f7fa" />
    </linearGradient>

    <linearGradient id="clipGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="50%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>

    <linearGradient id="lensGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#0284c7" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0.4" />
    </linearGradient>

    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0f7a8a" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#0f7a8a" />
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Filters -->
    <filter id="softShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#0b1b2b" flood-opacity="0.25" />
    </filter>

    <filter id="glassGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0284c7" flood-opacity="0.3" />
    </filter>

    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#059669" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Ambient Glow Circles -->
  <circle cx="270" cy="210" r="180" fill="url(#bgGlow)" />
  <circle cx="430" cy="110" r="45" fill="#38bdf8" fill-opacity="0.08" />
  <circle cx="100" cy="320" r="60" fill="#34d399" fill-opacity="0.06" />

  <!-- Background Grid Lines (Subtle Technical Audit feel) -->
  <g stroke="#94a3b8" stroke-opacity="0.12" stroke-width="1" stroke-dasharray="3,3">
    <line x1="60" y1="80" x2="480" y2="80" />
    <line x1="60" y1="160" x2="480" y2="160" />
    <line x1="60" y1="240" x2="480" y2="240" />
    <line x1="60" y1="320" x2="480" y2="320" />
    <line x1="120" y1="40" x2="120" y2="380" />
    <line x1="240" y1="40" x2="240" y2="380" />
    <line x1="360" y1="40" x2="360" y2="380" />
  </g>

  <!-- MAIN CLIPBOARD (Audit Board) -->
  <g transform="translate(130, 40)" filter="url(#softShadow)">
    <!-- Backing Board -->
    <rect x="0" y="15" width="230" height="320" rx="18" fill="url(#boardGrad)" stroke="#204569" stroke-width="2" />
    
    <!-- Paper Sheet -->
    <rect x="15" y="32" width="200" height="288" rx="10" fill="url(#paperGrad)" />

    <!-- Top Metallic Clip -->
    <rect x="75" y="5" width="80" height="24" rx="6" fill="url(#clipGrad)" stroke="#475569" stroke-width="1.5" />
    <rect x="95" y="0" width="40" height="12" rx="4" fill="#64748b" />
    <circle cx="115" cy="17" r="4" fill="#334155" />

    <!-- Document Header / Title Area -->
    <rect x="32" y="52" width="75" height="10" rx="4" fill="#0f7a8a" />
    <rect x="32" y="68" width="110" height="6" rx="3" fill="#cbd5e1" />
    <line x1="32" y1="84" x2="198" y2="84" stroke="#e2e8f0" stroke-width="1.5" />

    <!-- CHECKLIST ITEM 1 -->
    <g transform="translate(32, 98)">
      <circle cx="10" cy="10" r="10" fill="url(#greenGrad)" />
      <path d="M6 10 L9 13 L14 7" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
      <rect x="28" y="4" width="95" height="7" rx="3.5" fill="#334155" />
      <rect x="28" y="14" width="60" height="5" rx="2.5" fill="#94a3b8" />
    </g>

    <!-- CHECKLIST ITEM 2 -->
    <g transform="translate(32, 138)">
      <circle cx="10" cy="10" r="10" fill="url(#greenGrad)" />
      <path d="M6 10 L9 13 L14 7" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
      <rect x="28" y="4" width="115" height="7" rx="3.5" fill="#334155" />
      <rect x="28" y="14" width="75" height="5" rx="2.5" fill="#94a3b8" />
    </g>

    <!-- CHECKLIST ITEM 3 (Under Inspection) -->
    <g transform="translate(32, 178)">
      <circle cx="10" cy="10" r="10" fill="url(#greenGrad)" />
      <path d="M6 10 L9 13 L14 7" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
      <rect x="28" y="4" width="85" height="7" rx="3.5" fill="#0284c7" />
      <rect x="28" y="14" width="55" height="5" rx="2.5" fill="#38bdf8" />
    </g>

    <!-- CHECKLIST ITEM 4 -->
    <g transform="translate(32, 218)">
      <circle cx="10" cy="10" r="10" fill="url(#greenGrad)" />
      <path d="M6 10 L9 13 L14 7" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
      <rect x="28" y="4" width="105" height="7" rx="3.5" fill="#334155" />
      <rect x="28" y="14" width="70" height="5" rx="2.5" fill="#94a3b8" />
    </g>

    <!-- Document Footer Stamp Line -->
    <g transform="translate(32, 260)">
      <rect x="0" y="0" width="166" height="36" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
      <rect x="10" y="10" width="55" height="6" rx="3" fill="#94a3b8" />
      <rect x="10" y="20" width="40" height="5" rx="2.5" fill="#cbd5e1" />
      <circle cx="140" cy="18" r="11" fill="none" stroke="#10b981" stroke-width="1.5" stroke-dasharray="2,2" />
      <path d="M135 18 L138 21 L145 15" fill="none" stroke="#10b981" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </g>

  <!-- FLOATING CARD: AUDIT METRICS (Top Right) -->
  <g transform="translate(350, 65)" filter="url(#softShadow)">
    <rect x="0" y="0" width="145" height="85" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />
    <circle cx="20" cy="22" r="9" fill="#e0f2fe" />
    <path d="M16 22 L19 25 L25 19" fill="none" stroke="#0284c7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    <text x="36" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#0f172a">Quality Score</text>
    <text x="18" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#059669">99.8%</text>
    
    <!-- Mini progress bar -->
    <rect x="18" y="62" width="110" height="6" rx="3" fill="#e2e8f0" />
    <rect x="18" y="62" width="105" height="6" rx="3" fill="url(#greenGrad)" />
  </g>

  <!-- FLOATING CARD: COMPLIANCE SHIELD (Left Side) -->
  <g transform="translate(45, 140)" filter="url(#softShadow)">
    <rect x="0" y="0" width="125" height="110" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />
    <!-- Shield Icon -->
    <g transform="translate(42, 15)">
      <path d="M20 0 C32 0 40 4 40 16 C40 32 20 44 20 44 C20 44 0 32 0 16 C0 4 8 0 20 0 Z" fill="url(#shieldGrad)" />
      <!-- Star in shield -->
      <path d="M20 10 L23 17 L30 18 L25 23 L26 30 L20 26 L14 30 L15 23 L10 18 L17 17 Z" fill="url(#goldGrad)" />
    </g>
    <text x="62" y="78" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#0f172a">Verified Audit</text>
    <text x="62" y="94" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="500" fill="#64748b">100% Accuracy</text>
  </g>

  <!-- FLOATING BADGE: ZERO DEFECTS (Bottom Left) -->
  <g transform="translate(55, 290)" filter="url(#badgeShadow)">
    <rect x="0" y="0" width="120" height="38" rx="19" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.5" />
    <circle cx="19" cy="19" r="10" fill="url(#greenGrad)" />
    <path d="M15 19 L18 22 L23 16" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <text x="36" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#065f46">Zero Errors</text>
  </g>

  <!-- PRECISION MAGNIFYING GLASS (Over Checklist) -->
  <g transform="translate(260, 160)" filter="url(#glassGlow)">
    <!-- Handle -->
    <g transform="rotate(42, 100, 100)">
      <rect x="88" y="170" width="22" height="95" rx="11" fill="url(#boardGrad)" stroke="#334155" stroke-width="1.5" />
      <rect x="94" y="175" width="10" height="85" rx="5" fill="#475569" fill-opacity="0.5" />
      <rect x="91" y="158" width="16" height="15" rx="3" fill="url(#clipGrad)" />
    </g>

    <!-- Outer Rim -->
    <circle cx="95" cy="95" r="76" fill="none" stroke="url(#rimGrad)" stroke-width="12" />
    <circle cx="95" cy="95" r="70" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.6" />

    <!-- Lens Glass -->
    <circle cx="95" cy="95" r="70" fill="url(#lensGrad)" />

    <!-- Inspection Target Detail Inside Glass -->
    <g transform="translate(55, 55)">
      <!-- Target reticle -->
      <circle cx="40" cy="40" r="32" fill="#ffffff" fill-opacity="0.85" />
      <circle cx="40" cy="40" r="32" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,3" />
      
      <!-- Big Bold Verified Checkmark inside Lens -->
      <circle cx="40" cy="36" r="18" fill="url(#greenGrad)" />
      <path d="M32 36 L38 42 L48 30" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
      
      <!-- "PASSED" label pill -->
      <rect x="18" y="58" width="44" height="15" rx="7.5" fill="#0f7a8a" />
      <text x="40" y="69" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="800" fill="#ffffff" letter-spacing="0.5">PASSED</text>
    </g>

    <!-- Lens Glare Reflection Accent -->
    <path d="M45 55 A65 65 0 0 1 125 35" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-opacity="0.75" />
    <path d="M38 75 A65 65 0 0 1 55 45" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.5" />
  </g>

  <!-- SPARKLES / DECORATIVE STARS -->
  <g fill="#fbbf24">
    <path d="M120 70 Q120 80 130 80 Q120 80 120 90 Q120 80 110 80 Q120 80 120 70 Z" />
    <path d="M470 230 Q470 238 478 238 Q470 238 470 246 Q470 238 462 238 Q470 238 470 230 Z" />
    <path d="M380 340 Q380 346 386 346 Q380 346 380 352 Q380 346 374 346 Q380 346 380 340 Z" />
  </g>
</svg>
